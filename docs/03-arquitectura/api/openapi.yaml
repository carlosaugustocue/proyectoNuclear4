openapi: 3.1.0
info:
  title: API de la plataforma colaborativa de comparación de precios — Núcleo
  version: 0.4.0
  description: |
    Contrato preliminar del núcleo (Corte 1). Decisiones: ADR-0004 (REST + OpenAPI),
    ADR-0006 (idempotencia para registro offline), ADR-0009 (neutralidad).
    Reglas transversales:
    - Las respuestas públicas NO incluyen identidad ni ubicación de reportantes (EC-07).
    - La comparación siempre declara su criterio de orden y no tiene campos de patrocinio (EC-06).
    - Errores en formato Problem Details (RFC 9457).

    Estado de implementación (corte 2, 2026-11-16). Implementados y cubiertos por
    pruebas Feature (`backend/tests/Feature/Api/V1`):
    `GET /productos`, `GET /productos/{productoId}`, `GET /establecimientos`,
    `POST /reportes-precio`, `GET /comparaciones` y `GET /comparaciones/resumen`.
    Los demás endpoints (propuestas, confirmaciones, marcas, referencias mayoristas,
    mis aportes y cuentas) siguen PLANIFICADOS y llevan `x-estado: planificado`. La consola de
    moderación (`/moderacion/casos`, `/moderacion/perfiles`) y Comercial ya están implementados.
    Límite por IP (ADR-0024): 600 lecturas y 60 escrituras por minuto; al superarlo responde 429
    con Retry-After (Problem Details). Las respuestas incluyen X-RateLimit-Limit y X-RateLimit-Remaining.
    Mientras no exista el contexto Identidad (ADR-0014), `POST /reportes-precio` acepta
    solicitudes anónimas: el servidor agrupa los aportes con un seudónimo HMAC interno
    que nunca se publica (RN-07, EC-07).
servers:
  - url: http://localhost:8080/v1
    description: Entorno local (docker compose)
tags:
  - name: Catálogo
  - name: Establecimientos
  - name: Precios
  - name: Comparación
  - name: Canasta
    description: Canasta comparada (Anexo 1, opción A1; ADR-0017 a ADR-0019)
  - name: Comercial
    description: Perfiles, precio oficial, promociones y correcciones (corte 3; ADR-0015, ADR-0022, ADR-0023)
  - name: Confianza
  - name: Moderación
  - name: Cuentas

paths:
  /productos:
    get:
      tags: [Catálogo]
      summary: Buscar productos por nombre, alias o EAN (RF-01)
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2 }, description: Texto libre (sin distinción de tildes ni mayúsculas) }
        - { name: ean, in: query, schema: { type: string, pattern: '^[0-9]{8,14}$' } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                type: object
                required: [items, pagina]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductoResumen' } }
                  pagina: { $ref: '#/components/schemas/Paginacion' }
        '400': { $ref: '#/components/responses/Problema' }

  /productos/{productoId}:
    get:
      tags: [Catálogo]
      summary: Detalle de producto con presentaciones (RF-02)
      parameters: [ { $ref: '#/components/parameters/ProductoId' } ]
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Problema' }

  /productos/propuestas:
    post:
      x-estado: planificado
      tags: [Catálogo]
      summary: Proponer un producto o presentación nuevo (RF-03)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropuestaProducto' }
      responses:
        '201':
          description: Propuesta creada (pendiente de moderación)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }

  /establecimientos:
    get:
      tags: [Establecimientos]
      summary: Directorio y búsqueda por cercanía (RF-05, RF-06)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: municipio, in: query, schema: { type: string }, example: Armenia }
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/RadioKm'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Establecimientos
          content:
            application/json:
              schema:
                type: object
                required: [items, pagina]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Establecimiento' } }
                  pagina: { $ref: '#/components/schemas/Paginacion' }

  /establecimientos/propuestas:
    post:
      x-estado: planificado
      tags: [Establecimientos]
      summary: Proponer un establecimiento nuevo (RF-07)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropuestaEstablecimiento' }
      responses:
        '201':
          description: Propuesta creada (pendiente de moderación)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '400': { $ref: '#/components/responses/Problema' }

  /reportes-precio:
    post:
      tags: [Precios]
      summary: Registrar un precio observado (RF-08, RF-09)
      description: |
        Idempotente mediante `Idempotency-Key` (UUID generado en el cliente al guardar en la cola local).
        Un reintento con la misma clave devuelve 200 con el mismo recurso, sin duplicar (EC-09).
        La evaluación de confianza es asíncrona (ADR-0003): la respuesta indica estado `PENDIENTE_EVALUACION`.
        Autenticación opcional hasta que exista el contexto Identidad (ADR-0014).
      security: [ {}, { bearerAuth: [] } ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportePrecioNuevo' }
      responses:
        '202':
          description: Aceptado; se evaluará la confianza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportePrecioAceptado' }
        '200':
          description: Reintento con una clave ya procesada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportePrecioAceptado' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '429':
          description: Límite de aportes excedido (RN-08)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /observaciones/{observacionId}/confirmaciones:
    post:
      x-estado: planificado
      tags: [Precios]
      summary: Confirmar que un precio sigue vigente — "sigue igual" (RF-10)
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/ObservacionId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Confirmación aceptada }
        '404': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }

  /observaciones/{observacionId}/marcas:
    post:
      x-estado: planificado
      tags: [Confianza]
      summary: Marcar un precio como dudoso (RF-19)
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/ObservacionId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, enum: [PRECIO_INCORRECTO, PRODUCTO_EQUIVOCADO, ESTABLECIMIENTO_EQUIVOCADO, DESACTUALIZADO, OTRO] }
                comentario: { type: string, maxLength: 280 }
      responses:
        '201': { description: Marca registrada; puede abrir un caso de moderación }
        '404': { $ref: '#/components/responses/Problema' }

  /comparaciones:
    get:
      tags: [Comparación]
      summary: Comparar el precio de un producto entre establecimientos (RF-13 a RF-17)
      description: |
        No requiere autenticación. Lee el modelo de lectura proyectado (ADR-0003).
        El orden depende exclusivamente de `orden` (RN-10, ADR-0009).
      parameters:
        - { name: productoId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: presentacionId, in: query, schema: { type: string, format: uuid }, description: 'Si se omite, se comparan todas las presentaciones normalizadas por unidad base' }
        - { name: municipio, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/RadioKm'
        - name: orden
          in: query
          schema: { type: string, enum: [precio_unidad, distancia], default: precio_unidad }
        - name: incluirNoVigentes
          in: query
          schema: { type: boolean, default: false }
          description: Si es true, incluye observaciones vencidas o no confiables, siempre con advertencia (RF-16)
      responses:
        '200':
          description: Resultado de la comparación
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=30' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoComparacion' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }

  /comparaciones/resumen:
    get:
      tags: [Comparación]
      summary: Menor precio vigente por producto (tarjetas de la PWA)
      description: |
        Resume el modelo de lectura para varias tarjetas en una sola llamada (evita N consultas, EC-04).
        Solo cuenta observaciones vigentes (RN-04, RN-09). Conserva el orden de `productoIds`.
      parameters:
        - name: productoIds
          in: query
          required: true
          description: Lista separada por comas, máximo 50 UUID
          schema: { type: string }
      responses:
        '200':
          description: Un resumen por producto solicitado
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=30' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ResumenProducto' }
        '400': { $ref: '#/components/responses/Problema' }

  /canastas/comparacion:
    post:
      tags: [Canasta]
      summary: Compara una canasta de 1 a 20 productos entre establecimientos
      description: |
        Calcula, por establecimiento, el total de la canasta con el menor precio vigente por unidad base
        (RN-01, RN-02, RN-04, RN-09, RN-12). Los productos sin precio vigente se listan en `faltantes` y
        **nunca se suman como cero** (ADR-0019). El orden responde solo al criterio declarado en
        `criterioOrden` (RN-13, ADR-0009); las promociones van aparte en `contenidoPromocional`.
        Consulta segura e idempotente: la canasta no se guarda ni requiere cuenta (ADR-0018). Se usa POST
        porque la lista no cabe de forma razonable en la URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCanasta' }
      responses:
        '200':
          description: Resultado de la canasta por establecimiento
          headers:
            Cache-Control: { schema: { type: string }, example: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoCanasta' }
        '422': { $ref: '#/components/responses/Problema' }

  /comercial/perfiles:
    post:
      tags: [Comercial]
      summary: Solicita un perfil comercial para un establecimiento del directorio (RF-31)
      description: |
        El perfil nace `PENDIENTE` y no puede publicar hasta que un moderador lo verifique (ADR-0022).
        Los datos de contacto son privados: ninguna respuesta pública los devuelve (EC-07).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPerfilComercial' }
      responses:
        '201':
          description: Perfil solicitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPerfilComercial' }
        '422': { $ref: '#/components/responses/Problema' }

  /moderacion/perfiles/{perfilId}/verificacion:
    post:
      tags: [Comercial, Moderación]
      summary: Verifica un perfil pendiente y emite la credencial de comercio (una sola vez)
      security: [{ credencialModeracion: [] }]
      parameters:
        - { name: perfilId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Perfil verificado; la credencial no se vuelve a mostrar (solo se guarda su hash)
          headers:
            Cache-Control: { schema: { type: string }, example: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilComercialVerificado' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }

  /moderacion/perfiles/{perfilId}/revocacion:
    post:
      tags: [Comercial, Moderación]
      summary: Revoca un perfil; su credencial deja de publicar y sus promociones dejan de mostrarse
      security: [{ credencialModeracion: [] }]
      parameters:
        - { name: perfilId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Perfil revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPerfilComercial' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }

  /comercial/precios-oficiales:
    post:
      tags: [Comercial]
      summary: Publica el precio oficial de una presentación del propio establecimiento (RF-32)
      description: |
        Entra por el mismo flujo que un reporte, con `fuente = COMERCIO`, y pasa por las mismas reglas de
        confianza (RN-05 a RN-07, ADR-0015): solo es `CONFIABLE` si se corrobora y queda `POR_VERIFICAR` si
        es anómalo. Se ordena con el mismo criterio que cualquier precio (RN-10).
      security: [{ credencialComercio: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPrecioOficial' }
      responses:
        '202':
          description: Precio oficial aceptado; la confianza se evalúa en el worker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportePrecioAceptado' }
        '200':
          description: Reintento con una Idempotency-Key ya procesada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportePrecioAceptado' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }

  /comercial/promociones:
    post:
      tags: [Comercial]
      summary: Publica una promoción del propio establecimiento (RF-33, RN-14)
      description: |
        Se muestra solo en `contenidoPromocional` de la comparación y de la canasta, mientras esté vigente
        y el perfil verificado (RN-16). Nunca cambia `items`, el orden ni el total (EC-06, AR-02).
      security: [{ credencialComercio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPromocion' }
      responses:
        '201':
          description: Promoción publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromocionCreada' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }

  /comercial/promociones/{promocionId}:
    delete:
      tags: [Comercial]
      summary: Retira una promoción propia
      security: [{ credencialComercio: [] }]
      parameters:
        - { name: promocionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Promoción retirada }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }

  /comercial/correcciones:
    post:
      tags: [Comercial]
      summary: Solicita la corrección de información sobre el propio establecimiento (RF-34)
      security: [{ credencialComercio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCorreccion' }
      responses:
        '202':
          description: Caso de moderación abierto
          content:
            application/json:
              schema:
                type: object
                required: [referencia, estado]
                properties:
                  referencia: { type: string, format: uuid }
                  estado: { type: string, enum: [EN_MODERACION] }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }

  /referencias-mayoristas:
    get:
      x-estado: planificado
      tags: [Comparación]
      summary: Precio mayorista de referencia (SIPSA), separado de la comparación (RF-25, ADR-0010)
      parameters:
        - { name: productoId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Referencias disponibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReferenciaMayorista' }

  /mis-aportes:
    get:
      x-estado: planificado
      tags: [Precios]
      summary: Aportes del usuario autenticado y su estado (RF-12)
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Aportes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MiAporte' }
                  pagina: { $ref: '#/components/schemas/Paginacion' }

  /moderacion/casos:
    get:
      tags: [Moderación]
      summary: Cola de casos, los más antiguos primero (RF-20)
      description: >-
        Cada caso trae la observación con lo necesario para decidir. Nunca incluye el seudónimo
        ni datos del reportante (EC-07). Credencial de moderación compartida hasta tener cuentas (ADR-0022).
      security: [ { bearerAuth: [moderador] } ]
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ABIERTO, RESUELTO], default: ABIERTO } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Casos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CasoModeracion' } }
                  pagina: { $ref: '#/components/schemas/Paginacion' }
        '401': { $ref: '#/components/responses/Problema' }

  /moderacion/casos/{casoId}/decision:
    post:
      tags: [Moderación]
      summary: Resolver un caso; queda en bitácora (RF-20, RNF-11)
      description: >-
        CONFIRMAR_OBSERVACION y INVALIDAR_OBSERVACION cambian el estado de confianza de la observación
        y la comparación se actualiza por el flujo normal (ADR-0003). SUSPENDER_CUENTA responde 409
        hasta que exista el contexto Identidad. Los casos sin observación (CORRECCION_COMERCIO) solo
        admiten CERRAR_SIN_CAMBIOS.
      security: [ { bearerAuth: [moderador] } ]
      parameters:
        - { name: casoId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion, justificacion]
              properties:
                accion: { type: string, enum: [CONFIRMAR_OBSERVACION, INVALIDAR_OBSERVACION, SUSPENDER_CUENTA, CERRAR_SIN_CAMBIOS] }
                justificacion: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Caso resuelto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasoModeracion' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }

  /moderacion/perfiles:
    get:
      tags: [Moderación]
      summary: Perfiles comerciales por estado, para verificarlos (RF-31)
      description: Sin nombre ni teléfono de contacto (EC-07).
      security: [ { bearerAuth: [moderador] } ]
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, VERIFICADO, REVOCADO], default: PENDIENTE } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Perfiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        perfilId: { type: string, format: uuid }
                        estado: { type: string, enum: [PENDIENTE, VERIFICADO, REVOCADO] }
                        solicitadoEn: { type: string, format: date-time }
                        establecimiento:
                          type: [object, 'null']
                          properties:
                            id: { type: string, format: uuid }
                            nombre: { type: string }
                            direccion: { type: [string, 'null'] }
                  pagina: { $ref: '#/components/schemas/Paginacion' }
        '401': { $ref: '#/components/responses/Problema' }

  /cuentas:
    post:
      x-estado: planificado
      tags: [Cuentas]
      summary: Crear cuenta con autorización de tratamiento de datos (RF-22)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena, aceptaTratamientoDatos, versionPolitica]
              properties:
                correo: { type: string, format: email }
                contrasena: { type: string, minLength: 10, writeOnly: true }
                alias: { type: string, maxLength: 30, description: Seudónimo; nunca se muestra junto a sus reportes }
                aceptaTratamientoDatos: { type: boolean, const: true }
                versionPolitica: { type: string, example: '2026-10' }
      responses:
        '201': { description: Cuenta creada; se envía correo de verificación }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    credencialComercio:
      type: http
      scheme: bearer
      description: Credencial de 40 caracteres emitida al verificar el perfil comercial (ADR-0022)
    credencialModeracion:
      type: http
      scheme: bearer
      description: Secreto MODERACION_TOKEN del entorno mientras Identidad sigue diferida (ADR-0022)

  parameters:
    ProductoId: { name: productoId, in: path, required: true, schema: { type: string, format: uuid } }
    ObservacionId: { name: observacionId, in: path, required: true, schema: { type: string, format: uuid } }
    Lat: { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
    Lon: { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
    RadioKm: { name: radioKm, in: query, schema: { type: number, minimum: 0.1, maximum: 50, default: 3 } }
    Pagina: { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Tamano: { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }

  responses:
    Problema:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    UnidadBase:
      type: string
      enum: [KG, L, UNIDAD]
    UnidadMedida:
      type: string
      enum: [G, KG, ML, L, UNIDAD]
    EstadoConfianza:
      type: string
      description: |
        CONFIABLE: corroborada por ≥ 2 reportantes independientes (RN-05).
        NO_CORROBORADO: un solo reporte, sin anomalía; se muestra sin advertencia.
        POR_VERIFICAR: anomalía estadística (RN-06); se muestra con advertencia y abre caso de moderación.
        NO_CONFIABLE: decisión de moderación; no se muestra como vigente.
      enum: [CONFIABLE, NO_CORROBORADO, POR_VERIFICAR, NO_CONFIABLE]
    ResumenProducto:
      type: object
      required: [productoId, unidadBase, precioPorUnidadMin, establecimientos]
      properties:
        productoId: { type: string, format: uuid }
        unidadBase: { oneOf: [ { $ref: '#/components/schemas/UnidadBase' }, { type: 'null' } ] }
        precioPorUnidadMin: { type: [string, 'null'], description: Decimal exacto; null si no hay precios vigentes }
        precioMin: { type: [string, 'null'] }
        establecimientos: { type: integer, minimum: 0 }
    FuenteObservacion:
      type: string
      enum: [REPORTANTE, COMERCIO, EQUIPO_SEMILLA]
      description: COMERCIO se usará desde el corte 3. Nunca incluye la identidad del reportante (EC-07).
    Dinero:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      description: Valor en COP como cadena decimal para evitar errores de coma flotante (RN-02)
      example: '9900'

    ProductoResumen:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Arroz blanco Diana }
        marca: { type: string }
        categoria: { type: string, example: Abarrotes }
        imagen:
          description: >-
            Foto del producto con licencia libre y su crédito, que el cliente debe mostrar. Solo https.
            null cuando no hay foto: el cliente muestra una ilustración de la categoría.
          oneOf:
            - type: 'null'
            - type: object
              required: [url]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                credito: { type: [string, 'null'], example: 'Foto: Open Food Facts (CC BY-SA 3.0)' }

    Producto:
      allOf:
        - $ref: '#/components/schemas/ProductoResumen'
        - type: object
          required: [presentaciones, estadoCatalogo]
          properties:
            alias: { type: array, items: { type: string } }
            estadoCatalogo: { type: string, enum: [APROBADO, PENDIENTE] }
            presentaciones:
              type: array
              items: { $ref: '#/components/schemas/Presentacion' }

    Presentacion:
      type: object
      required: [id, cantidad, unidad, unidadesPorEmpaque, unidadBase]
      properties:
        id: { type: string, format: uuid }
        descripcion: { type: string, example: Paca 6 x 330 mL }
        cantidad: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', example: '330' }
        unidad: { $ref: '#/components/schemas/UnidadMedida' }
        unidadesPorEmpaque: { type: integer, minimum: 1, example: 6 }
        unidadBase: { $ref: '#/components/schemas/UnidadBase' }
        ean: { type: [string, 'null'], pattern: '^[0-9]{8,14}$' }

    PropuestaProducto:
      type: object
      required: [nombre, categoria, presentacion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120 }
        marca: { type: string, maxLength: 60 }
        categoria: { type: string }
        presentacion:
          type: object
          required: [cantidad, unidad, unidadesPorEmpaque]
          properties:
            cantidad: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
            unidad: { $ref: '#/components/schemas/UnidadMedida' }
            unidadesPorEmpaque: { type: integer, minimum: 1, default: 1 }
            ean: { type: string, pattern: '^[0-9]{8,14}$' }

    Establecimiento:
      type: object
      required: [id, nombre, tipo, municipio, ubicacion]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Tienda Doña Rosa }
        tipo: { type: string, enum: [TIENDA_BARRIO, MINIMERCADO, SUPERMERCADO] }
        direccion: { type: string }
        barrio: { type: string }
        municipio: { type: string, example: Armenia }
        ubicacion: { $ref: '#/components/schemas/Punto' }
        distanciaKm: { type: number, description: Solo si se envió lat/lon }
        estadoDirectorio: { type: string, enum: [APROBADO, PENDIENTE] }

    PropuestaEstablecimiento:
      type: object
      required: [nombre, tipo, municipio, ubicacion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120 }
        tipo: { type: string, enum: [TIENDA_BARRIO, MINIMERCADO, SUPERMERCADO] }
        direccion: { type: string }
        barrio: { type: string }
        municipio: { type: string }
        ubicacion: { $ref: '#/components/schemas/Punto' }

    Punto:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
      description: Ubicación del ESTABLECIMIENTO (dato público), nunca del dispositivo del reportante

    ReportePrecioNuevo:
      type: object
      required: [presentacionId, establecimientoId, precio, observadoEn]
      properties:
        presentacionId: { type: string, format: uuid }
        establecimientoId: { type: string, format: uuid }
        precio: { $ref: '#/components/schemas/Dinero' }
        observadoEn:
          type: string
          format: date-time
          description: Momento en que se guardó en el dispositivo (puede ser anterior al envío si hubo modo offline)
        fotoId: { type: string, format: uuid, description: Opcional; foto subida previamente }
      additionalProperties: false

    ReportePrecioAceptado:
      type: object
      required: [observacionId, estado]
      properties:
        observacionId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE_EVALUACION] }

    ResultadoComparacion:
      type: object
      required: [producto, criterioOrden, unidadBase, items, generadoEn]
      properties:
        producto: { $ref: '#/components/schemas/ProductoResumen' }
        criterioOrden:
          type: object
          required: [campo, descripcion]
          properties:
            campo: { type: string, enum: [precio_unidad, distancia] }
            descripcion: { type: string, example: 'Ordenado por precio por kilogramo, de menor a mayor. Ningún comercio paga por su posición.' }
        unidadBase: { $ref: '#/components/schemas/UnidadBase' }
        generadoEn: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemComparacion' }
        contenidoPromocional:
          type: array
          description: Promociones vigentes del módulo Comercial (ADR-0009, ADR-0023). Siempre separado de `items`; no afecta su orden.
          items: { $ref: '#/components/schemas/PromocionPublica' }
      additionalProperties: false

    ItemComparacion:
      type: object
      required: [posicion, establecimiento, presentacion, precio, precioPorUnidad, observadoEn, fuente, estadoConfianza, vigente]
      properties:
        posicion: { type: integer, minimum: 1 }
        establecimiento:
          type: object
          required: [id, nombre, tipo]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            tipo: { type: string }
            barrio: { type: string }
            distanciaKm: { type: number }
        presentacion: { $ref: '#/components/schemas/Presentacion' }
        precio: { $ref: '#/components/schemas/Dinero' }
        precioPorUnidad: { $ref: '#/components/schemas/Dinero' }
        observadoEn: { type: string, format: date-time }
        fuente: { $ref: '#/components/schemas/FuenteObservacion' }
        confirmaciones: { type: integer, minimum: 0, description: Número de corroboraciones independientes (no identifica a nadie) }
        estadoConfianza: { $ref: '#/components/schemas/EstadoConfianza' }
        vigente: { type: boolean }
        advertencia:
          type: [string, 'null']
          example: Precio reportado hace 9 días; puede estar desactualizado
      additionalProperties: false

    SolicitudCanasta:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Productos distintos (RN-11)
          items:
            type: object
            required: [productoId, cantidad, unidad]
            additionalProperties: false
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: string, pattern: '^[0-9]+(\.[0-9]{1,3})?$', example: '500' }
              unidad: { type: string, enum: [g, kg, mL, L, unidad], description: Debe ser comparable con la unidad base del producto (RN-03) }
        orden:
          type: string
          enum: [disponibilidad, total]
          default: disponibilidad
        municipio: { type: string, maxLength: 60, example: Armenia }

    ResultadoCanasta:
      type: object
      required: [criterioOrden, totalProductos, items, generadoEn, establecimientos, contenidoPromocional]
      properties:
        criterioOrden:
          type: object
          required: [campo, descripcion]
          properties:
            campo: { type: string, enum: [disponibilidad, total] }
            descripcion: { type: string }
        totalProductos: { type: integer, minimum: 1, maximum: 20 }
        items:
          type: array
          items:
            type: object
            required: [productoId, cantidad, unidadBase]
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: string, description: Cantidad en la unidad base }
              unidadBase: { type: string, enum: [kg, L, unidad] }
        generadoEn: { type: string, format: date-time }
        establecimientos:
          type: array
          items: { $ref: '#/components/schemas/ResultadoCanastaEstablecimiento' }
        contenidoPromocional:
          type: array
          description: Siempre separado del resultado; nunca altera el total ni el orden (ADR-0019, ADR-0023)
          items: { $ref: '#/components/schemas/PromocionPublica' }

    PromocionPublica:
      type: object
      description: Promoción visible (RN-16). No incluye datos del perfil ni de contacto (EC-07).
      required: [tipo, descripcion, establecimiento, productoId, vigenteHasta, esPromocion]
      properties:
        tipo: { type: string, enum: [DESCUENTO_PORCENTUAL, PRECIO_ESPECIAL, PAGUE_X_LLEVE_Y] }
        descripcion: { type: string, example: '20 % de descuento' }
        establecimiento:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        productoId: { type: string, format: uuid }
        vigenteHasta: { type: string, format: date-time }
        esPromocion: { type: boolean, enum: [true] }
      additionalProperties: false

    SolicitudPerfilComercial:
      type: object
      required: [establecimientoId, nombreContacto]
      properties:
        establecimientoId: { type: string, format: uuid }
        nombreContacto: { type: string, maxLength: 120 }
        telefonoContacto: { type: string, maxLength: 30 }

    EstadoPerfilComercial:
      type: object
      required: [perfilId, estado]
      properties:
        perfilId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE, VERIFICADO, REVOCADO] }
      additionalProperties: false

    PerfilComercialVerificado:
      allOf:
        - $ref: '#/components/schemas/EstadoPerfilComercial'
        - type: object
          required: [credencial]
          properties:
            credencial: { type: string, minLength: 40, maxLength: 40 }

    SolicitudPrecioOficial:
      type: object
      required: [presentacionId, establecimientoId, precio]
      properties:
        presentacionId: { type: string, format: uuid }
        establecimientoId: { type: string, format: uuid }
        precio: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$', example: '4000.00' }

    SolicitudPromocion:
      type: object
      required: [establecimientoId, productoId, tipo, inicio, fin]
      description: 'RN-14: descuento 1–90 %, precio especial > 0, pague X lleve Y con lleve > pague ≥ 1, vigencia ≤ 31 días.'
      properties:
        establecimientoId: { type: string, format: uuid }
        productoId: { type: string, format: uuid }
        tipo: { type: string, enum: [DESCUENTO_PORCENTUAL, PRECIO_ESPECIAL, PAGUE_X_LLEVE_Y] }
        valor: { type: string, description: Porcentaje o precio especial, example: '20' }
        pague: { type: integer, minimum: 1 }
        lleve: { type: integer, minimum: 2 }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }

    PromocionCreada:
      type: object
      required: [promocionId, descripcion]
      properties:
        promocionId: { type: string, format: uuid }
        descripcion: { type: string }

    SolicitudCorreccion:
      type: object
      required: [establecimientoId, detalle]
      properties:
        establecimientoId: { type: string, format: uuid }
        detalle: { type: string, minLength: 10, maxLength: 150 }

    ResultadoCanastaEstablecimiento:
      type: object
      required: [posicion, establecimiento, total, disponibles, totalProductos, completa, faltantes, lineas]
      properties:
        posicion: { type: integer, minimum: 1 }
        establecimiento:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        total: { $ref: '#/components/schemas/Dinero' }
        disponibles: { type: integer }
        totalProductos: { type: integer }
        completa: { type: boolean }
        faltantes:
          type: array
          description: productoId sin precio vigente en el establecimiento; no se suman al total
          items: { type: string, format: uuid }
        lineas:
          type: array
          items:
            type: object
            required: [productoId, precioPorUnidad, cantidad, subtotal]
            properties:
              productoId: { type: string, format: uuid }
              precioPorUnidad: { $ref: '#/components/schemas/Dinero' }
              cantidad: { type: string }
              subtotal: { $ref: '#/components/schemas/Dinero' }

    ReferenciaMayorista:
      type: object
      required: [fuente, mercado, precioPorUnidad, unidadBase, fecha]
      properties:
        fuente: { type: string, const: SIPSA-DANE }
        mercado: { type: string, example: 'Armenia, Mercar' }
        precioPorUnidad: { $ref: '#/components/schemas/Dinero' }
        unidadBase: { $ref: '#/components/schemas/UnidadBase' }
        fecha: { type: string, format: date }
        nota: { type: string, example: Precio mayorista de referencia; no corresponde al precio de una tienda }

    MiAporte:
      type: object
      properties:
        observacionId: { type: string, format: uuid }
        producto: { type: string }
        establecimiento: { type: string }
        precio: { $ref: '#/components/schemas/Dinero' }
        observadoEn: { type: string, format: date-time }
        estadoConfianza: { $ref: '#/components/schemas/EstadoConfianza' }
        vecesConsultado: { type: integer }

    CasoModeracion:
      type: object
      properties:
        id: { type: string, format: uuid }
        origen: { type: string, enum: [ANOMALIA_AUTOMATICA, MARCA_USUARIO, CORRECCION_COMERCIO] }
        estado: { type: string, enum: [ABIERTO, RESUELTO] }
        detalle: { type: [string, 'null'], example: 'Precio 300.00 atípico frente a otros reportes de la presentación' }
        abiertoEn: { type: string, format: date-time }
        observacionId: { type: [string, 'null'], format: uuid, description: null en casos sin observación (CORRECCION_COMERCIO) }
        observacion:
          type: [object, 'null']
          description: Contexto para decidir; nunca incluye el seudónimo del reportante (EC-07)
          properties:
            precio: { $ref: '#/components/schemas/Dinero' }
            observadoEn: { type: string, format: date-time }
            fuente: { type: string }
            producto: { type: [string, 'null'] }
            presentacion: { type: [string, 'null'] }
            establecimiento: { type: [string, 'null'] }
            estadoConfianza: { type: [string, 'null'], enum: [CONFIABLE, NO_CORROBORADO, POR_VERIFICAR, NO_CONFIABLE, null] }

    Paginacion:
      type: object
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }

    Problema:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
