; Configuración de PHP para el proyecto Nuclear
; RN-02: decimales exactos — bcmath habilitado por extensión
; Producción: opcache habilitado; desarrollo: se sobreescribe vía override

[PHP]
expose_php = Off
max_execution_time = 30
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
