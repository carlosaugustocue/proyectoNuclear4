server {
    listen ${PORT};
    root /usr/share/nginx/html;
    server_tokens off;   # no revelar la versión de nginx

    # El service worker no se cachea para que las actualizaciones lleguen enseguida
    location = /sw.js {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de la SPA (vue-router en modo history)
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }
}
