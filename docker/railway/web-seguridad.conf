# Cabeceras de seguridad de la PWA (C-18). Se incluye en CADA location porque en nginx un
# add_header dentro de una location anula los del nivel server. __API_ORIGEN__ se reemplaza en
# el build con el origen de VITE_API_URL (la API vive en otro subdominio).
#
# CSP:
#  - script-src 'self': el build no tiene scripts en línea (el registro del SW es /registerSW.js).
#  - style-src 'unsafe-inline': Vue (:style) y Leaflet posicionan con estilos en línea; no ejecuta código.
#  - img-src: fotos de Open Food Facts (CC BY-SA) y teselas de OpenStreetMap del mapa.
#  - connect-src: la API y las fotos que el service worker guarda para uso sin conexión.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.openfoodfacts.org https://tile.openstreetmap.org; connect-src 'self' __API_ORIGEN__ https://images.openfoodfacts.org; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La geolocalización se usa (solo en el dispositivo) para «Ver los más cercanos»: se permite al propio origen.
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
