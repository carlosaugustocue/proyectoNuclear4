# SonarCloud (ADR-0021 · M-14, M-13). El equipo crea la organización y el proyecto en sonarcloud.io;
# si las claves generadas difieren, se corrigen aquí.
sonar.organization=carlosaugustocue
sonar.projectKey=carlosaugustocue_proyectoNuclear4
sonar.projectName=Plataforma de comparación de precios (Proyecto Nuclear VI)

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts
sonar.exclusions=**/vendor/**,**/node_modules/**,frontend/src/**/*.test.ts
sonar.sourceEncoding=UTF-8

# Cobertura del backend medida con pcov en el job `backend` (M-13).
sonar.php.coverage.reportPaths=backend/build/coverage/clover.xml
# M-13 mide el dominio y la aplicación del backend. Las vistas y componentes Vue se validan con la
# prueba de usabilidad, axe y la prueba de humo, no con cobertura: se excluyen de la métrica, no del análisis.
sonar.coverage.exclusions=frontend/**,backend/app/Http/**,backend/app/Providers/**,backend/app/Models/**

# Duplicación: el umbral (3 %) y las demás condiciones se definen en el quality gate del proyecto en SonarCloud.
sonar.cpd.exclusions=backend/database/migrations/**
