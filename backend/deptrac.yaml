# Pruebas de arquitectura por CONTEXTO DELIMITADO (ADR-0002, ADR-0016).
#
#   AR-01  Un contexto solo puede depender de los contextos declarados en su lista.
#          Cualquier otra dependencia rompe el pipeline de CI.
#   AR-02  Ningún contexto del núcleo depende de Comercial (corte 3). Comparación en
#          particular no puede leer atributos comerciales: la neutralidad (ADR-0009)
#          queda garantizada por estructura y no solo por convención.
#
# Las reglas por capa (Domain/Application/Infrastructure) están en deptrac-capas.yaml.
# Uso: ./vendor/bin/deptrac analyse            (este archivo)
#      ./vendor/bin/deptrac analyse --config-file=deptrac-capas.yaml

deptrac:
  paths:
    - ./app

  layers:
    - { name: Compartido,       collectors: [ { type: directory, value: app/Domains/Compartido/.* } ] }
    - { name: Catalogo,         collectors: [ { type: directory, value: app/Domains/Catalogo/.* } ] }
    - { name: Establecimientos, collectors: [ { type: directory, value: app/Domains/Establecimientos/.* } ] }
    - { name: Precios,          collectors: [ { type: directory, value: app/Domains/Precios/.* } ] }
    - { name: Confianza,        collectors: [ { type: directory, value: app/Domains/Confianza/.* } ] }
    - { name: Comparacion,      collectors: [ { type: directory, value: app/Domains/Comparacion/.* } ] }
    - { name: Moderacion,       collectors: [ { type: directory, value: app/Domains/Moderacion/.* } ] }
    - { name: Identidad,        collectors: [ { type: directory, value: app/Domains/Identidad/.* } ] }
    - { name: Ingesta,          collectors: [ { type: directory, value: app/Domains/Ingesta/.* } ] }
    - { name: Canasta,          collectors: [ { type: directory, value: app/Domains/Canasta/.* } ] }
    - { name: Comercial,        collectors: [ { type: directory, value: app/Domains/Comercial/.* } ] }
    - { name: Http,             collectors: [ { type: directory, value: app/Http/.* } ] }
    - { name: Providers,        collectors: [ { type: directory, value: app/Providers/.* } ] }
    - { name: Console,          collectors: [ { type: directory, value: app/Console/.* } ] }

  ruleset:
    # Núcleo compartido (Shared Kernel): dinero, unidades, coordenadas. No depende de nadie.
    Compartido: []

    # Contextos de soporte
    Catalogo:         [Compartido]
    Establecimientos: [Compartido]

    # Precios recibe observaciones; consulta el catálogo para resolver la presentación.
    Precios:          [Compartido, Catalogo]

    # Confianza escucha PrecioRegistrado y lee el historial a través del repositorio de Precios.
    Confianza:        [Compartido, Precios]

    # Comparación proyecta el modelo de lectura a partir de ConfianzaEvaluada.
    # NO incluye Comercial (AR-02).
    Comparacion:      [Compartido, Confianza, Catalogo, Establecimientos]

    # Moderación abre casos a partir de ConfianzaEvaluada.
    Moderacion:       [Compartido, Confianza]

    # Identidad (ADR-0025) implementa el puerto SuspensionDeCuentas de Moderación y lee el autor
    # de una observación por la interfaz pública de Precios. Nadie del núcleo depende de Identidad.
    Identidad:        [Compartido, Precios, Moderacion]
    Ingesta:          [Compartido, Catalogo, Establecimientos, Precios]

    # Canasta (Anexo 1, A1; ADR-0017): solo usa la interfaz pública de Comparación. NO incluye Comercial (AR-02).
    Canasta:          [Compartido, Comparacion]

    # Comercial (corte 3) puede leer el núcleo, pero el núcleo nunca lo lee a él.
    # ADR-0023: también usa Moderación (correcciones) e implementa el puerto de Comparación.
    Comercial:        [Compartido, Catalogo, Establecimientos, Precios, Comparacion, Moderacion]

    # Adaptadores de entrada y composición del contenedor
    Http:      [Canasta, Compartido, Catalogo, Establecimientos, Precios, Confianza, Comparacion, Moderacion, Identidad, Ingesta, Comercial]
    Providers: [Canasta, Compartido, Catalogo, Establecimientos, Precios, Confianza, Comparacion, Moderacion, Identidad, Ingesta, Comercial]
    # Comandos de medición de calidad (pruebas-calidad/): adaptador de entrada, como Http.
    Console:   [Compartido, Catalogo, Establecimientos, Precios, Confianza, Comparacion, Moderacion, Identidad, Ingesta]
