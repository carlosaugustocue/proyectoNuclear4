services:

  # ─── Reverse proxy + sirve la PWA compilada ───────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ─── API Laravel (PHP-FPM) ────────────────────────────────────────────────
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nuclear}
      DB_USERNAME: ${DB_USERNAME:-nuclear}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    restart: unless-stopped

  # ─── Worker (procesa outbox: confianza + proyección comparación) ──────────
  worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan queue:work --queue=domain-events --tries=3 --sleep=2
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nuclear}
      DB_USERNAME: ${DB_USERNAME:-nuclear}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    restart: unless-stopped

  # ─── Base de datos PostgreSQL 16 + PostGIS 3.4 ───────────────────────────
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nuclear}
      POSTGRES_USER: ${DB_USERNAME:-nuclear}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nuclear} -d ${DB_DATABASE:-nuclear}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── PWA Vue 3 (dev server con HMR) ──────────────────────────────────────
  pwa:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - pwa_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/v1
    restart: unless-stopped

volumes:
  pgdata:
  pwa_node_modules:
